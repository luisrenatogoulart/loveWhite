<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Clique Aqui</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #1a001a;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: "Poppins", sans-serif;
            position: relative;
        }

        /* Fundo corações */
        .coracao {
            position: absolute;
            bottom: -10px;
            width: 25px;
            height: 25px;
            background: #ff4d88;
            transform: rotate(45deg);
            animation: subir 6s linear infinite;
            opacity: 0.8;
        }

        .coracao::before,
        .coracao::after {
            content: "";
            position: absolute;
            width: 25px;
            height: 25px;
            background: #ff4d88;
            border-radius: 50%;
        }

        .coracao::before { top: -12px; left: 0; }
        .coracao::after { left: -12px; top: 0; }

        @keyframes subir {
            0% { transform: translateY(0) rotate(45deg) scale(1); opacity: 1; }
            100% { transform: translateY(-120vh) rotate(45deg) scale(1.7); opacity: 0; }
        }

        .botoes {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
    z-index: 10;
}

        /* Coração pulsando */
        .pulse {
            position: absolute;
            width: 200px;
            height: 200px;
            background: rgba(255, 50, 120, 0.25);
            border-radius: 50%;
            filter: blur(40px);
            animation: pulse 3s infinite ease-in-out;
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.3; }
            50% { transform: scale(1.5); opacity: 0.7; }
            100% { transform: scale(1); opacity: 0.3; }
        }

        /* Botão principal */
        .btn-inicio {
            padding: 20px 45px;
            font-size: 26px;
            border: none;
            border-radius: 20px;
            background: #ff1a75;
            color: white;
            cursor: pointer;
            box-shadow: 0 0 20px #ff4da6, 0 0 40px #ff1a75;
            transition: 0.3s;
        }

        .btn-inicio:hover {
            transform: scale(1.08);
            box-shadow: 0 0 35px #ff80bf, 0 0 60px #ff1a75;
        }

        /* Fade para transição */
        #fadeOut {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: black;
            opacity: 0;
            pointer-events: none;
            transition: opacity 1s ease-in-out;
            z-index: 9999;
        }

        /* MODAL DE SENHA */
        #senhaModal {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(4px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .caixa-senha {
            background: #2b002b;
            padding: 35px 25px;
            border-radius: 20px;
            border: 2px solid #ff4da6;
            box-shadow: 0 0 25px #ff1a75, 0 0 60px #ff4da6 inset;
            text-align: center;
            width: 80%;
            max-width: 330px;
            animation: zoomIn 0.4s ease;
        }

        @keyframes zoomIn {
            from { transform: scale(0.7); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .caixa-senha h2 {
            color: #ff9ac9;
            font-size: 22px;
            margin-bottom: 15px;
        }

        .input-senha {
            width: 100%;
            padding: 12px;
            font-size: 18px;
            border-radius: 10px;
            border: none;
            outline: none;
            margin-bottom: 20px;
            background: #fff0fa;
            text-align: center;
            color: #b3005a;
            font-weight: bold;
            box-shadow: 0 0 12px #ff4da6 inset;
        }

        .btn-confirmar {
            width: 100%;
            padding: 12px;
            font-size: 18px;
            border-radius: 10px;
            border: none;
            background: #ff1a75;
            color: white;
            cursor: pointer;
            box-shadow: 0 0 20px #ff4da6;
            transition: 0.3s;
        }

        .btn-confirmar:hover {
            box-shadow: 0 0 40px #ff4da6;
            transform: scale(1.05);
        }

        /* animação de sucesso */
        .sucesso {
            animation: sucessoAnim 0.5s ease forwards;
        }

        @keyframes sucessoAnim {
            0% { transform: scale(1); box-shadow: 0 0 20px #ff4da6; }
            50% { transform: scale(1.15); box-shadow: 0 0 35px #ff80bf; }
            100% { transform: scale(1); box-shadow: 0 0 20px #ff4da6; }
        }
        .btn-namorados {
            margin-top: 20px;
            padding: 15px 35px;
            border: none;
            border-radius: 50px;
            background: linear-gradient(45deg, #ff4d88, #ff99cc);
            color: white;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(255, 77, 136, 0.6);
            transition: all 0.3s ease;
            animation: brilho 2s infinite alternate;
        }

        .btn-namorados:hover {
            transform: scale(1.08);
            box-shadow: 0 0 30px rgba(255, 77, 136, 0.9);
        }

        @keyframes brilho {
            from {
                box-shadow: 0 0 15px rgba(255, 77, 136, 0.5);
            }
            to {
                box-shadow: 0 0 35px rgba(255, 77, 136, 1);
            }
        }
    </style>
</head>

<body>

<div class="pulse"></div>

<div class="botoes">
    <button class="btn-inicio" onclick="abrirSenha()">
        clique aqui
    </button>

    <button class="btn-namorados" onclick="abrirEspecial()">
        💖 Especial Dia dos Namorados 💖
    </button>
</div>

<div id="fadeOut"></div>

<!-- modal senha -->
<div id="senhaModal">
    <div class="caixa-senha" id="caixaSenha">
        <h2>digite aqui o meu ou seu apelido carinhoso:</h2>
        <input id="senhaInput" class="input-senha" type="password" placeholder="sua senha aqui">
        <button class="btn-confirmar" onclick="validarSenha()">Confirmar</button>
    </div>
</div>

<script>
/* ------- corações do fundo ------- */
function criarCoracoes() {
    for (let i = 0; i < 20; i++) {
        const c = document.createElement("div");
        c.classList.add("coracao");
        c.style.left = Math.random() * 100 + "vw";
        c.style.animationDelay = Math.random() * 4 + "s";
        document.body.appendChild(c);
        setTimeout(() => c.remove(), 6000);
    }
}
setInterval(criarCoracoes, 1200);

/* ------- abrir modal ------- */
function abrirSenha() {
    document.getElementById("senhaModal").style.display = "flex";
    document.getElementById("senhaInput").focus();
}

/* ------- validar senha ------- */
function validarSenha() {
    const senha = document.getElementById("senhaInput").value;
    const caixa = document.getElementById("caixaSenha");

    if (senha === "branquinha" || senha === "pretinho") {
        caixa.classList.add("sucesso");

        setTimeout(() => {
            const fade = document.getElementById("fadeOut");
            fade.style.opacity = "1";

            setTimeout(() => {
                window.location.href = "scripts/mensagem.html";
            }, 900);
        }, 400);

    } else {
        alert("Senha errada, amor 💔");
    }
}
function abrirEspecial() {
    const fade = document.getElementById("fadeOut");
    fade.style.opacity = "1";

    setTimeout(() => {
        window.location.href = "scripts/namorados.html";
    }, 900);
}
</script>

</body>
</html>
