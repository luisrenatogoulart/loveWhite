<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Feliz 3 Meses</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: #ffe6f2;
            font-family: Arial, sans-serif;
        }
        .btn-inicio {
            padding: 20px 40px;
            background: #ff4d88;

        .btn-inicio:hover {
            background: #e6005c;
            transform: scale(1.05);

        audio { display:none; }

</head>

<audio src="musica1.mp3" autoplay loop></audio>
